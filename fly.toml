# fly.toml app configuration file generated for njnjh on 2026-11-02T11:03:07Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'njnjh'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  checks = [{ grace_period = '30s', interval = '30s', method = 'GET', path = '/health', timeout = '5s' }]
  concurrency = { hard_limit = 40, soft_limit = 20, type = 'requests' }

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
